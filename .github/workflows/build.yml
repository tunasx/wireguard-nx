name: Build Switch packages
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Protocol and MITM regression tests
        run: |
          make -C wg-sysmodule test -j2
          make -C mitm-sysmodule test -j2
          c++ -std=c++17 -Wall -Wextra -Werror -Icommon/include tools/test_i18n.cpp -o /tmp/test-i18n
          /tmp/test-i18n
          python3 tools/check_translations.py
  switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install build utilities
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3 zip
      - name: Prepare official Atmosphere-libs for HOS 23.0.1
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/common/lib/Atmosphere-libs"
          python3 tools/test_prepare_atmosphere_libs.py
          python3 tools/prepare_atmosphere_libs.py
      - name: Build matching libnx with HOS 23.x filesystem APIs
        run: make -C common/lib/libnx install -j2
      - name: Build UTF-8 manager
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make -C manager -j2
      - name: Build localized overlay
        run: make -C overlay -j2
      - name: Build WireGuard sysmodule
        run: make -C wg-sysmodule dist -j2
      - name: Build MITM sysmodule
        run: make -C mitm-sysmodule dist -j2
      - name: Check sysmodule resource budgets
        run: make -C wg-sysmodule resource-report
      - name: Record build dependencies
        run: |
          git rev-parse HEAD > BUILD-DEPENDENCIES.txt
          git submodule status --recursive >> BUILD-DEPENDENCIES.txt
          sha256sum common/patches/atmosphere-libs-wgnx.patch >> BUILD-DEPENDENCIES.txt
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++" --version >> BUILD-DEPENDENCIES.txt
      - name: Save sysmodule debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-nx-debug-symbols
          path: |
            wg-sysmodule/out/*.elf
            wg-sysmodule/build/*.map
            mitm-sysmodule/out/*.elf
            mitm-sysmodule/build/*.map
            BUILD-DEPENDENCIES.txt
          if-no-files-found: error
      - name: Assemble SD card package
        run: |
          mkdir -p package/switch/.overlays package/switch/wireguard-nx package/config/wireguard-nx
          cp -r wg-sysmodule/out/atmosphere package/
          cp -r mitm-sysmodule/out/atmosphere package/
          cp manager/out/wireguard-nx.nro package/switch/wireguard-nx/
          cp overlay/out/wireguard-nx.ovl package/switch/.overlays/
          cp config/*.example package/config/wireguard-nx/
          cp README.zh-CN.md package/README.zh-CN.md
          cp LICENSE package/LICENSE
          git rev-parse HEAD > package/BUILD-COMMIT.txt
          cp BUILD-DEPENDENCIES.txt package/
          cd package
          zip -r ../wireguard-nx-sdcard.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: wireguard-nx-sdcard
          path: wireguard-nx-sdcard.zip
          if-no-files-found: error
